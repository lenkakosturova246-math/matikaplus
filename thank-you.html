<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ďakujeme</title>
  <link rel="icon" type="image/svg+xml" href="favicon-circle.svg?v=2">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="navbar.css">
  <link rel="stylesheet" href="site-common.css">
  <style>
    body {
      font-family: 'Nunito Sans', 'Montserrat', Arial, sans-serif;
      font-size: 17px;
      text-align: center;
      padding: 98px 20px 54px;
      background: #202d3a;
      color: white;
    }
    .box {
      max-width: 500px;
      margin: 0 auto;
      background: white;
      color: #202d3a;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }
    .box h1 {
      font-family: 'Montserrat', sans-serif;
    }
    .box p {
      font-size: 1.04rem;
    }
    .box > a {
      display: inline-block;
      margin-top: 20px;
      text-decoration: none;
      background: #202d3a;
      color: white;
      padding: 10px 20px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div id="navbar-placeholder"></div>

  <div class="box">
    <h1>Ďakujeme!</h1>
    <p>Vaša správa bola úspešne odoslaná.</p>
    <a href="index.html">Späť na stránku</a>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="navbar-loader.js?v=3"></script>
<script>
document.querySelectorAll('a[href^="index.html#"]').forEach((link) => {
    const href = link.getAttribute('href');
    const hash = href.includes('#') ? href.slice(href.indexOf('#')) : '';
    if (!hash || !['#registracia', '#kurzy'].includes(hash)) return;

    link.addEventListener('click', (event) => {
        event.preventDefault();
        const target = hash === '#registracia' ? 'registracia' : 'kurzy';
        window.location.href = `index.html?target=${target}`;
    });
});
</script>
</body>
</html>
